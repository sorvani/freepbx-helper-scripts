# FreePBX 14/15/16 on Sangoma OS (CentOS) only. On FreePBX 17+ (Debian) this file does
# not work -- there is no /etc/httpd/conf.d and no php7-script handler, and switching the
# handler to php-fpm makes every PUT return 503. Use the Debian version instead:
# https://github.com/sorvani/freepbx17-yealink-backup
<Directory /tftpboot>
# if you are on FreePBX 15 or lower, change the handler to
# php5-script
  AddHandler php7-script .yealink
  AddType text/html .yealink
  RewriteEngine On
  RewriteCond %{REQUEST_METHOD} =PUT
  RewriteRule ^(.*)$ put.yealink?url=$1
</Directory>
